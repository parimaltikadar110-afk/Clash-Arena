<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No connection - ClashX7</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0b0f;color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .icon{font-size:56px;margin-bottom:12px}
  h2{margin:0 0 8px;font-size:20px}
  p{margin:0 0 20px;color:#aaa;font-size:14px;line-height:1.5}
  button{padding:12px 28px;border:0;border-radius:10px;background:#dc2626;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .status{margin-top:14px;font-size:12px;color:#777}
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h2>No internet connection</h2>
  <p>Please check your mobile data or Wi-Fi.<br>The app will reload automatically when you are back online.</p>
  <button onclick="location.href='/'">Try again</button>
  <div class="status" id="s">Waiting for connection…</div>
  <script>
    window.addEventListener('online', function () { location.href = '/'; });
  </script>
</body>
</html>
